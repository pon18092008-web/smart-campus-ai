<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Умный кампус AI</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="logo"><span class="logo-mark">УК</span><div><b>Умный кампус AI</b><small>Управление инфраструктурой кампуса</small></div></div>
    <h1>Вход в систему</h1>
    <p class="muted">Выберите роль, чтобы открыть панель управления.</p>
    <form id="loginForm">
      <label>Электронная почта<input type="email" id="email" placeholder="admin@campus.kg" required></label>
      <label>Пароль<input type="password" id="password" placeholder="Минимум 4 символа" required minlength="4"></label>
      <label>Роль
        <select id="role">
          <option value="admin">Администратор</option>
          <option value="engineer">Инженер</option>
          <option value="operator">Оператор</option>
        </select>
      </label>
      <div class="error" id="loginError"></div>
      <button class="btn" type="submit">Войти</button>
    </form>
    <p class="note">⚠️ Учебная имитация входа: пароль нигде не проверяется и не сохраняется. Это не настоящая защита.</p>
  </div>
</div>
<script src="assets/js/data.js"></script>
<script src="assets/js/storage.js"></script>
<script src="assets/js/ai.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/login.js"></script>
</body>
</html>
