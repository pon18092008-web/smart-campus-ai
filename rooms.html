<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Помещения — Умный кампус AI</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<main>
  <div class="card">
    <div class="toolbar">
      <input type="search" id="roomSearch" placeholder="Поиск по номеру, типу или корпусу…">
      <select id="buildingFilter">
        <option value="">Все корпуса</option>
        <option>Корпус A</option><option>Корпус B</option><option>Корпус C</option>
      </select>
      <select id="statusFilter">
        <option value="">Все статусы</option>
        <option value="normal">Норма</option>
        <option value="warning">Внимание</option>
        <option value="critical">Критично</option>
      </select>
    </div>
    <p class="muted" id="roomCount"></p>
    <div class="table-wrap"><table>
      <thead><tr><th>ID</th><th>Корпус</th><th>Этаж</th><th>Тип</th><th>Температура</th><th>CO2</th><th>Энергия</th><th>Занятость</th><th>Статус</th></tr></thead>
      <tbody id="roomsBody"></tbody>
    </table></div>
  </div>
</main>
<div class="toast" id="toast"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/storage.js"></script>
<script src="assets/js/ai.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/rooms.js"></script>
</body>
</html>
