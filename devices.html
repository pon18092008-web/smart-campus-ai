<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Устройства — Умный кампус AI</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<main>
  <div class="kpi-grid" id="deviceKpis"></div>
  <div class="card">
    <div class="toolbar">
      <input type="search" id="deviceSearch" placeholder="Поиск по ID датчика или помещению…">
      <select id="typeFilter"><option value="">Все типы</option></select>
      <select id="deviceStatusFilter">
        <option value="">Все состояния</option>
        <option value="online">В сети</option>
        <option value="offline">Не в сети</option>
      </select>
    </div>
    <p class="muted" id="deviceCount"></p>
    <div class="table-wrap"><table>
      <thead><tr><th>ID датчика</th><th>Помещение</th><th>Тип</th><th>Значение</th><th>Статус</th><th>Последнее обновление</th><th>Действие</th></tr></thead>
      <tbody id="devicesBody"></tbody>
    </table></div>
  </div>
</main>
<div class="toast" id="toast"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/storage.js"></script>
<script src="assets/js/ai.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/devices.js"></script>
</body>
</html>
